[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vb6-modern-converter"
version = "0.1.0"
description = "Professional-grade VB6 to C#/VB.NET conversion CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vb6-modern-converter = "vb6_converter.cli:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
